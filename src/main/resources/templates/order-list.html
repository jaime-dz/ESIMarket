<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de pedidos</title>
    <link rel="stylesheet" href="/css/general_styles.css">
    <link rel="icon" href="/Images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="sideMenu" class="sidebar user-view">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">&times;</a>
        <a href="/purchase/">Historial de compras</a>
        <a href="/orders/">Lista de pedidos</a>
        <a href="/service/">Lista de servicios</a>
        <a href="/donations/">Donaciones</a>
        <a href="/chat/">Chats</a>
    </div>
    <header class="menu-bar menu-superior">
            <div class="header-left">
                <div class="hamburger-icon user-view" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <img class="logo-item" src="/Images/logo64.png" alt="Logo ESIMarket">
                <h1 style="color:#E57200; font-family: monospace; font-weight: bold; margin:0;">ESI</h1>
                <h1 style="color:#ffffff; font-family: monospace; margin:0;">Market</h1>
            </div>

            <nav class="header-center">
                <ul>
                    <li><a href="/home/">Inicio</a></li> <li><a href="/home/about">Sobre nosotros</a></li>
                </ul>
            </nav>

            <div class="header-right">
                
                <div class="guest-view">
                    <a href="/auth/login">Iniciar sesión</a>
                    <a href="/auth/signup" style="background-color: rgba(255,255,255,0.1); border-radius:5px;">Registrarse</a>
                </div>

                <div class="user-view" style="display: none;">
                    
                    <button class="btn-publicar" onclick="window.location.href='/products/create'">Publicar</button>
                    
                    <div class="profile-container">
                        <div class="coins-info">
                            <span th:text="${profile?.saldoMoneda}"></span> <span>⚙️</span>
                        </div>
                        <img class="profile-avatar" src="/Images/huevoverde.jpeg" alt="Perfil">
                        
                        <div class="dropdown-content">
                            <a href="/profile/">Mi Perfil</a>
                            <a href="#" id="btn-logout">Cerrar sesión</a>
                        </div>
                    </div>
                </div>

            </div>
    </header>
        <main class="main-content" style="padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%;">

            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px;">
                <h2 style="color: #00587C; margin: 0;">Mis Pedidos</h2>

                <div>
                    <label for="filtroEstado" style="color:#555; font-weight:bold;">Estado:</label>
                    <select id="filtroEstado" onchange="gestionarCargaPedidos()" style="padding: 5px; border-radius: 5px; border: 1px solid #ddd;">
                        <option value="Todos">Todos</option>
                        <option value="PorEntregar">Por Entregar</option>
                        <option value="Entregado">Entregado</option>
                        <option value="Recogido">Recogido</option>
                    </select>
                </div>
            </div>

            <div id="pedidos-container">
                <div class="loader"></div>
                <p style="text-align: center;">Cargando pedidos...</p>
            </div>
        </main>
    <footer class="menu-bar menu-inferior">
            <ul>
                <li><a th:href="@{/home/}">Inicio</a></li>
                <li><a th:href="@{/home/about}">Sobre nosotros</a></li>

                <li class="guest-view">
                    <a th:href="@{/auth/login}">Iniciar sesión</a>
                </li>
                <li class="guest-view">
                    <a th:href="@{/auth/signup}">Registrarse</a>
                </li>

                <li class="sn">
                    <a href="https://www.instagram.com/esimarket_uca/"><img width="64px" height="64px" src="/Images/instagram.png" alt="Instagram"></a>
                    <a href="https://x.com/esimarket_uca"><img width="64px" height="64px" src="/Images/twitter.png" alt="Twitter"></a>
                </li>
            </ul>
        </footer>
    <script src="/js/common.js" type="module"></script>
    <script>
        async function accionEntregarPedido(idPedido, esTaquilla) {
            let nTaquilla = 0;

            // Si el pedido requiere taquilla, pedimos el número al usuario
            if (esTaquilla) {
                const input = prompt("📦 Este pedido es en Taquilla.\nPor favor, introduce el número de taquilla donde has dejado el producto:");

                // Si le da a Cancelar, paramos
                if (input === null) return;

                // Validamos que sea un número
                nTaquilla = parseInt(input);
                if (isNaN(nTaquilla)) {
                    alert("Error: Debes introducir un número de taquilla válido.");
                    return;
                }
            } else {
                // Si es en mano, confirmamos normal y enviamos 0 como taquilla
                if(!confirm("¿Confirmas que has entregado el producto en mano?")) return;
            }

            try {
                // ENDPOINT ACTUALIZADO: /orders/deliver/{id}/{taquilla}
                const response = await fetch(`/orders/deliver/${idPedido}/${nTaquilla}`, { method: 'POST' });

                if(response.ok) {
                    gestionarCargaPedidos();
                } else {
                    const textoError = await response.text();
                    alert("Error al marcar entregado: " + textoError);
                }
            } catch(e) {
                console.error(e);
                alert("Error de conexión con el servidor");
            }
        }

        async function accionRecogerPedido(idPedido) {
            if(!confirm("¿Confirmas que has recogido el producto?")) return;
            try {
                // ENDPOINT ACTUALIZADO: /orders/pickup/{id}
                const response = await fetch(`/orders/pickup/${idPedido}`, { method: 'POST' });

                if(response.ok) {
                    gestionarCargaPedidos();
                } else {
                    const textoError = await response.text();
                    alert("Error al confirmar recogida: " + textoError);
                }
            } catch(e) {
                console.error(e);
                alert("Error de conexión");
            }
        }

            // --- CARGA Y RENDERIZADO ---
        async function gestionarCargaPedidos() {
            const container = document.getElementById("pedidos-container");
            const estadoFiltro = document.getElementById("filtroEstado").value;

            container.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loader"></div><p>Cargando...</p></div>';

            try {
                const response = await fetch("/orders/user", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: estadoFiltro })
                });

                if (!response.ok) throw new Error("Error cargando pedidos");

                const pedidos = await response.json();

                if (!pedidos || pedidos.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #666;">
                            <h3>No hay pedidos</h3>
                            <p>No se encontraron pedidos con el filtro "${estadoFiltro}".</p>
                        </div>`;
                    return;
                }

                const html = pedidos.map(p => {
                    const esComprador = p.esComprador;

                    let badgeHtml = '';
                    let otroUsuarioInfo = '';

                    if (esComprador) {
                        badgeHtml = '<span class="role-badge badge-comprador">Eres Comprador</span>';
                        otroUsuarioInfo = `<p><strong>Vendedor:</strong> ${p.nombreVendedor}</p>`;
                    } else {
                        badgeHtml = '<span class="role-badge badge-vendedor">Eres Vendedor</span>';
                        otroUsuarioInfo = `<p><strong>Comprador:</strong> ${p.nombreComprador}</p>`;
                    }

                    // Info Taquilla (Visualización)
                    let taquillaHtml = "";
                    // p.enTaquilla nos dice si el TIPO de entrega es taquilla
                    // p.nTaquilla es el numero real (si ya se ha asignado)
                    if (p.enTaquilla) {
                        if (p.nTaquilla && p.nTaquilla > 0) {
                            taquillaHtml = `<p style="color:#E57200; font-weight:bold; margin-top:5px;">📦 En Taquilla Nº ${p.nTaquilla}</p>`;
                        } else {
                            taquillaHtml = `<p style="color:#666; font-style:italic; font-size:0.9em;">(Entrega en taquilla)</p>`;
                        }
                    } else {
                        taquillaHtml = `<p style="color:#666; font-style:italic; font-size:0.9em;">(Entrega en mano)</p>`;
                    }

                    // Botones
                    let botonHtml = "";

                    if (esComprador && p.estado === 'Entregado') {
                        // Acción Recoger (Cliente)
                        botonHtml = `<button class="btn-finalizar" onclick="accionRecogerPedido(${p.idPedido})">Confirmar Recogida</button>`;
                    }
                    else if (!esComprador && p.estado === 'PorEntregar') {
                        // Acción Entregar (Vendedor)
                        // IMPORTANTE: Pasamos 'p.enTaquilla' (true/false) a la función para saber si pedir número
                        botonHtml = `<button class="btn-finalizar" onclick="accionEntregarPedido(${p.idPedido}, ${p.enTaquilla})">Marcar Entregado</button>`;
                    }
                    else if (p.estado === 'Recogido') {
                        botonHtml = `<span style="color:green; font-weight:bold;">✔ Completado</span>`;
                    }
                    else {
                         botonHtml = `<span style="color:#999; font-style:italic;">Esperando acción...</span>`;
                    }

                    return `
                        <div class="servicio-card">
                            <div class="servicio-info">
                                ${badgeHtml}
                                <h3>${p.nombreProd}</h3>
                                <p><strong>Estado:</strong> <span style="color:#00587C; font-weight:600;">${p.estado}</span></p>
                                ${otroUsuarioInfo}
                                ${taquillaHtml}
                            </div>
                            <div class="servicio-actions">
                                ${botonHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                container.innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        document.addEventListener("DOMContentLoaded", () => gestionarCargaPedidos());
    </script>
</body>
</html>
