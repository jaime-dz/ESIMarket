<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de pedidos</title>
    <link rel="stylesheet" href="/css/general_styles.css">
    <link rel="icon" href="/Images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="sideMenu" class="sidebar user-view">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">&times;</a>
        <a href="/purchase/user">Historial de compras</a>
        <a href="/orders/">Lista de pedidos</a>
        <a href="/service/user">Lista de servicios</a>
        <a href="/donations/donationByUser">Donaciones</a>
        <a href="/chat/">Chats</a>
    </div>
    <header class="menu-bar menu-superior">
            <div class="header-left">
                <div class="hamburger-icon user-view" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <img class="logo-item" src="/Images/logo64.png" alt="Logo ESIMarket">
                <h1 style="color:#E57200; font-family: monospace; font-weight: bold; margin:0;">ESI</h1>
                <h1 style="color:#ffffff; font-family: monospace; margin:0;">Market</h1>
            </div>

            <nav class="header-center">
                <ul>
                    <li><a href="/home/">Inicio</a></li> <li><a href="/home/about">Sobre nosotros</a></li>
                </ul>
            </nav>

            <div class="header-right">
                
                <div class="guest-view">
                    <a href="/auth/login">Iniciar sesión</a>
                    <a href="/auth/signup" style="background-color: rgba(255,255,255,0.1); border-radius:5px;">Registrarse</a>
                </div>

                <div class="user-view" style="display: none;">
                    
                    <button class="btn-publicar" onclick="window.location.href='/products/create'">Publicar</button>
                    
                    <div class="profile-container">
                        <div class="coins-info">
                            <span th:text="${profile?.saldoMoneda}"></span> <span>⚙️</span>
                        </div>
                        <img class="profile-avatar" src="/Images/huevoverde.jpeg" alt="Perfil">
                        
                        <div class="dropdown-content">
                            <a href="/profile/">Mi Perfil</a>
                            <a href="#" id="btn-logout">Cerrar sesión</a>
                        </div>
                    </div>
                </div>

            </div>
        </header>

    <main style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <div class="desplegable-pedidos">
            <label for="filtro-ped">Selecciona uno</label>
            <select name="filtro-ped" id="filtro-ped">
                <option value="todos">Todos</option>
                <option value="por entregar">Por entregar</option>
                <option value="por recoger">Por recoger</option>
            </select>
        </div>
        <div class="submit-button">
            <button type="button" onclick="gestionarCargaPedidos()">Aplicar</button>
        </div>

        <div id="lista-pedidos" class="pedidos-container" style="margin-top: 20px;">
        </div>
    </main>
    <footer class="menu-bar menu-inferior">
            <ul>
                <li><a th:href="@{/home/}">Inicio</a></li>
                <li><a th:href="@{/home/about}">Sobre nosotros</a></li>

                <li class="guest-view">
                    <a th:href="@{/auth/login}">Iniciar sesión</a>
                </li>
                <li class="guest-view">
                    <a th:href="@{/auth/signup}">Registrarse</a>
                </li>

                <li class="sn">
                    <a href="https://www.instagram.com/esimarket_uca/"><img width="64px" height="64px" src="/Images/instagram.png" alt="Instagram"></a>
                    <a href="https://x.com/esimarket_uca"><img width="64px" height="64px" src="/Images/twitter.png" alt="Twitter"></a>
                </li>
            </ul>
        </footer>
    <script src="/js/common.js" type="module"></script>
    <script>
        async function gestionarCargaPedidos(filtroOverride = null) {
            const select = document.getElementById('filtro-ped');
            const filtro = filtroOverride || select.value || "todos";
            const container = document.getElementById('lista-pedidos'); // El div que añadimos
            
            container.innerHTML = "<p>Cargando pedidos...</p>";

            try {
                // Usamos POST porque cambiamos el controlador a @PostMapping
                const response = await fetch('/orders/filter', {
                    method: 'POST', 
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filtro: filtro }) // Ajusta según tu FiltroPedRequest
                });

                if (!response.ok) throw new Error("Error cargando pedidos");

                const pedidos = await response.json();
                
                if (pedidos.length === 0) {
                    container.innerHTML = "<p>No hay pedidos con este filtro.</p>";
                    return;
                }

                // Generar HTML
                const html = pedidos.map(p => `
                    <div class="pedido-card" style="border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:8px;">
                        <h3>${p.nombreProd}</h3>
                        <p>Estado: <strong>${p.estado}</strong></p>
                        <p>Comprador: ${p.nombreComprador} | Vendedor: ${p.nombreVendedor}</p>
                        
                        ${p.esComprador && p.estado === 'Entregado' ? 
                        `<button onclick="accionRecogerPedido(${p.idPedido})">Confirmar Recogida</button>` : ''}
                        
                        ${!p.esComprador && p.estado === 'PorEntregar' ? 
                        `<button onclick="accionEntregarPedido(${p.idPedido})">Marcar Entregado</button>` : ''}
                    </div>
                `).join('');

                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                container.innerHTML = "<p>Error al cargar los datos.</p>";
            }
        }

        // Cargar al inicio
        document.addEventListener("DOMContentLoaded", () => gestionarCargaPedidos());
            </script>
</body>
</html>
