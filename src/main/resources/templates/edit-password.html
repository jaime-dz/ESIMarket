<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Cambiar contraseña</title>
    <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
</head>
<body>
    <div th:replace="~{common/general-fragments :: sidebar}"></div>
    <div th:replace="~{common/general-fragments :: menu-superior}"></div>
    <main>
        <h1>Cambiar contraseña</h1>
        <div class="form-container">

            <form id="signup" method="post">

                <div class="form-grupo">
                    <label for="newPassword" style="display:block; text-align:left; margin-bottom:5px;">Nueva contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" minlength="8" placeholder="Introduce tu nueva contraseña" required>
                        <span class="password-toggle-icon" onclick="togglePassword('newPassword', this)">🙈</span>
                    </div>
                </div>
                <br>

                <div class="form-grupo">
                    <label for="confirmPassword" style="display:block; text-align:left; margin-bottom:5px;">Repetir contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" placeholder="Repite la nueva contraseña" required>
                        <span class="password-toggle-icon" onclick="togglePassword('confirmPassword', this)">🙈</span>
                    </div>
                </div>

                <div id="pass-error-msg" style="display:none; color:red; margin-top:10px; font-weight:bold;">
                    Las contraseñas introducidas no coinciden.
                </div>

                <div th:if="${errorServidor}" style="color: red; margin-top: 10px; font-weight: bold;">
                    <p th:text="${errorServidor}"></p>
                </div>

                <br>

                <div class="form-buttons">
                    <button type="submit" class="btn-common btn-orange">Guardar</button>
                    <button type="button" class="btn-common btn-gray" onclick="window.location.href='/profile/'">Cancelar</button>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
    <script src="/js/common.js" ></script>
    <script src="/js/profile.js" ></script>
    <script>
        document.getElementById("signup").addEventListener("submit", async function(event) {
            event.preventDefault(); // Evita que el navegador cargue la pantalla negra

            // 1. Validar contraseñas
            const pass1 = document.getElementById("newPassword").value;
            const pass2 = document.getElementById("confirmPassword").value;
            const errorMsg = document.getElementById("pass-error-msg");
            const input2 = document.getElementById("confirmPassword");

            if (pass1 !== pass2) {
                errorMsg.style.display = "block";
                input2.style.border = "2px solid red";
                return;
            }

            // 2. Preparar los datos para el Controlador (formato x-www-form-urlencoded)
            const formData = new URLSearchParams();
            formData.append("newPassword", pass1);

            try {
                const response = await fetch('/profile/edit/password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const mensaje = await response.text();

                if (response.ok) {
                    // --- AQUÍ ESTÁ LA REDIRECCIÓN ---
                    // Si quieres un aviso antes, descomenta la siguiente línea:
                    // alert(mensaje);
                    window.location.href = "/profile/";
                } else {
                    // Si hubo error (ej: contraseña igual a la anterior)
                    alert("Error: " + mensaje);
                }

            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexión con el servidor.");
            }
        });
    </script>
</body>
</html>
