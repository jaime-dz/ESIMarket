<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Compras</title>
    <link rel="stylesheet" href="/css/general_styles.css">
    <link rel="icon" href="/Images/favicon.ico" type="image/x-icon"> <!-- icono pequeño en pestaña-->
</head>
<body>
<div id="sideMenu" class="sidebar user-view">
    <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">&times;</a>
    <a href="/purchase/">Historial de compras</a>
    <a href="/orders/">Lista de pedidos</a>
    <a href="/service/">Lista de servicios</a>
    <a href="/donations/">Donaciones</a>
    <a href="/chat/">Chats</a>
</div>
<header class="menu-bar menu-superior">
    <div class="header-left">
        <div class="hamburger-icon user-view" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <img class="logo-item" src="/Images/logo64.png" alt="Logo ESIMarket">
        <h1 style="color:#E57200; font-family: monospace; font-weight: bold; margin:0;">ESI</h1>
        <h1 style="color:#ffffff; font-family: monospace; margin:0;">Market</h1>
    </div>

    <nav class="header-center">
        <ul>
            <li><a href="/home/">Inicio</a></li> <li><a href="/home/about">Sobre nosotros</a></li>
        </ul>
    </nav>

    <div class="header-right">

        <div class="guest-view">
            <a href="/auth/login">Iniciar sesión</a>
            <a href="/auth/signup" style="background-color: rgba(255,255,255,0.1); border-radius:5px;">Registrarse</a>
        </div>

        <div class="user-view" style="display: none;">

            <button class="btn-publicar" onclick="window.location.href='/products/create'">Publicar</button>

            <div class="profile-container">
                <div class="coins-info">
                    <span th:text="${profile?.saldoMoneda}"></span> <span>⚙️</span>
                </div>
                <img class="profile-avatar" 
                            th:data-id="${profile?.correo}" 
                            src="/Images/huevoverde.jpeg" 
                            alt="Perfil">

                <div class="dropdown-content">
                    <a href="/profile/">Mi Perfil</a>
                    <a href="#" id="btn-logout">Cerrar sesión</a>
                </div>
            </div>
        </div>

    </div>
</header>
<main>
    <div id="lista-compras" class="lista-container">
    </div>
</main>

<footer class="menu-bar menu-inferior">
    <ul>
        <li><a th:href="@{/home/}">Inicio</a></li>
        <li><a th:href="@{/home/about}">Sobre nosotros</a></li>

        <li class="guest-view">
            <a th:href="@{/auth/login}">Iniciar sesión</a>
        </li>
        <li class="guest-view">
            <a th:href="@{/auth/signup}">Registrarse</a>
        </li>

        <li class="sn">
            <a href="https://www.instagram.com/esimarket_uca/"><img width="64px" height="64px" src="/Images/instagram.png" alt="Instagram"></a>
            <a href="https://x.com/esimarket_uca"><img width="64px" height="64px" src="/Images/twitter.png" alt="Twitter"></a>
        </li>
    </ul>
</footer>
<script src="/js/common.js" type="module"></script>
<script>
    async function gestionarCargaCompras() {
    const container = document.getElementById('lista-compras');
    if (!container) return;

    container.innerHTML = `<div style="text-align:center; padding:20px;"><div class="loader"></div> <p>Cargando tus compras...</p></div>`;

    try {
        const response = await fetch('/purchase/user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) throw new Error("Error de red");

        const compras = await response.json();

        if (!compras || compras.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">
                    <h3>No tienes compras registradas</h3>
                    <p>¡Echa un vistazo al catálogo!</p>
                </div>`;
            return;
        }

        const html = compras.map(c => {
            let metodoPago = c.tipoPago ? c.tipoPago : 'Desconocido';

            // --- LÓGICA DE VISUALIZACIÓN DE ENTREGA ---
            let htmlEntrega = '';

            // Solo mostramos la fila de entrega si es un OBJETO
            if (c.tipoProd === 'Objeto') {
                let textoEntrega = c.recepcion ? c.recepcion : 'No especificado';
                // Embellecer texto (ej: enMano -> en Mano)
                textoEntrega = textoEntrega.replace(/([A-Z])/g, ' $1').trim();

                htmlEntrega = `
                    <div class="info-row">
                        <span class="label">📦 Entrega:</span>
                        <span>${textoEntrega}</span>
                    </div>
                `;
            }

            // Lógica del Trueque
            const esTrueque = (c.tipoPago === 'Trueque' || c.tipoPago === 'trueque');
            const bloqueTrueque = (esTrueque && c.nombreProdTrueque)
                ? `<div class="trueque-box">🔄 Cambiado por: <strong>${c.nombreProdTrueque}</strong></div>`
                : '';

            const urlProducto = `/products/view/${c.idProd}`;

            return `
            <div class="compra-card" onclick="window.location.href='${urlProducto}'">

                <div class="card-header">
                    <h3>${c.nombreProd || 'Producto desconocido'}</h3>
                    <span class="fecha-badge">${c.fecha ? c.fecha.split(' ')[0] : ''}</span>
                </div>

                <div class="card-body">
                    <div style="margin-bottom: 5px; font-size: 0.85em; color: #E57200; font-weight: bold; text-transform: uppercase;">
                        ${c.tipoProd || 'Item'}
                    </div>

                    <div class="info-row">
                        <span class="label">💳 Pago:</span>
                        <span>${metodoPago}</span>
                    </div>

                    ${htmlEntrega}

                    ${bloqueTrueque}
                </div>

                <div class="card-footer">
                    ID Ref: #${c.idCompra}
                </div>
            </div>
            `;
        }).join('');

        container.innerHTML = html;

    } catch (error) {
        console.error("Error:", error);
        container.innerHTML = "<p>Error al cargar historial.</p>";
    }
}

document.addEventListener("DOMContentLoaded", gestionarCargaCompras);
</script>
</body>
</html>
