<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de servicios</title>
    <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
</head>
<body>
    <div th:replace="~{common/general-fragments :: sidebar}"></div>
    <div th:replace="~{common/general-fragments :: menu-superior}"></div>
    <main class="main-content" style="padding: 20px; max-width: 1000px; margin: 0 auto; width: 100%;">
        <h2 style="color: #00587C; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
            Servicios Activos
        </h2>

        <div id="servicios-container">
            <div style="text-align: center; color: #666; margin-top: 40px;">
                <div class="loader"></div>
                <p>Cargando tus servicios...</p>
            </div>
        </div>
    </main>
    <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
    <script src="/js/common.js" ></script>
    <script src="/js/service.js" ></script>
</body>
</html>
