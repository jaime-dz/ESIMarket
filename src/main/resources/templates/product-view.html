<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.nombre}">Detalle del Producto</title>
    <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
</head>
<body>
    <div th:replace="~{common/general-fragments :: sidebar}"></div>
    <div th:replace="~{common/general-fragments :: menu-superior}"></div>
    <main style="max-width: 1000px; margin: 40px auto; padding: 0 20px; width: 100%; box-sizing: border-box;">
    
        <div class="product-detail-wrapper" style="position: relative;">
            <div class="card-header">
                <div class="header-title-group">
                    <h1 class="detail-title" th:text="${product.nombre}">Nombre del Producto</h1>
                    <p class="product-ref">ID: <span th:text="${product.id}">000</span></p>
                </div>
                <button th:if="${product.isDisponible and isOwner}" 
                        class="btn-eliminar"
                        th:onclick="'eliminarProducto(' + ${product.id} + ')'">
                    ELIMINAR
                </button>
            </div>
            

            <div class="detail-image-col">
                <img th:if="${product.foto != null}" th:src="${product.fotoBase64}" alt="Producto">
                
                <img th:if="${product.foto == null and #strings.toLowerCase(product.tipo) == 'servicio'}"
                    src="/Images/engranaje.jpg" alt="Servicio">

                <img th:if="${product.foto == null and #strings.toLowerCase(product.tipo) != 'servicio'}"
                    src="/Images/book.jpg" alt="Producto">
            </div>

            <div class="detail-info-col">
                
                
                <div class="detail-price-box">
                    <span style="font-size: 0.6em;" th:text="${product.precio}">0</span> 
                    <span style="font-size: 0.6em;">⚙️</span>
                    <span th:if="${#strings.toLowerCase(product.tipo) == 'servicio'}" style="font-size: 0.6em; color: #666;">/ hora</span>
                </div>

                <div class="detail-meta-grid">
                    <div class="meta-item">
                        <span class="meta-label">Vendedor</span>
                        <span class="meta-value" th:text="${product.nombreVendedor}">Usuario</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Categoría</span>
                        <span class="meta-value" th:text="${product.tipo}">-</span>
                    </div>
                    <div class="meta-item" th:if="${product.tipo.toLowerCase() != 'servicio'}">
                        <span class="meta-label">Estado</span>
                        <span class="meta-value" th:text="${product.estado}">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Pago Aceptado</span>
                        <span class="meta-value" th:text="${product.pago}">-</span>
                    </div>
                    <div th:if="${#strings.toLowerCase(product.tipo) != 'servicio'}" class="meta-item">
                        <span class="meta-label">Entrega</span>
                        <span class="meta-value" th:text="${product.recepcionAceptada}">-</span>
                    </div>
                </div>
                
                <div class="description-box">
                    <h4 style="margin-top:0; color:#E57200;">Descripción</h4>
                    <p style="margin-bottom:0; text-align: left;" th:text="${product.descripcion ?: 'El vendedor no ha añadido una descripción detallada para este producto.'}"></p>
                </div>

                <div class="action-buttons">
                    <div class="user-view" style="display: none;">
                        <button th:if="${product.isDisponible and !isOwner}"
                                th:onclick="'comprarProducto(' + ${product.id} + ')'"
                                class="btn-estilo">
                            Comprar
                        </button>

                        <button class="btn-estilo" onclick="contactarVendedor()" style="margin-left: 10px; background-color: #2196F3;">
                            Contactar 💬
                        </button>
                    </div>


                    <button onclick="window.history.back()" 
                            class="btn-estilo btn-volver">
                        Volver
                    </button>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
    <div id="modalCompra" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModalCompra()">&times;</span>

            <div class="modal-header">
                <h2>Confirmar Compra</h2>
                <p>Por favor, configura los detalles de tu pedido.</p>
            </div>

            <div class="modal-body">
                <input type="hidden" id="modal-product-id">

                <div style="margin-bottom:10px;">
                    <label for="modal-select-pago" style="font-weight:bold; display:block; margin-bottom:5px;">Método de Pago:</label>
                    <select id="modal-select-pago" onchange="toggleTruequeModal()" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
                        <option value="Monedas"
                                th:if="${product.pago != null and (product.pago.name() == 'Monedas' or product.pago.name() == 'Ambos')}">
                            Monedas
                        </option>
                        <option value="Trueque"
                                th:if="${product.pago != null and (product.pago.name() == 'Trueque' or product.pago.name() == 'Ambos')}">
                            Trueque
                        </option>
                    </select>
                </div>

                <div id="modal-trueque-field" style="display:none; margin-bottom:15px; background: #fff3e0; padding: 10px; border-radius: 5px;">
                    <label for="modal-input-trueque-id" style="font-weight:bold; display:block; margin-bottom:5px; color:#E57200;">ID de tu producto a intercambiar:</label>
                    <input type="number" id="modal-input-trueque-id" placeholder="Ej: 45" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
                </div>

                <div style="margin-bottom:10px;"
                     th:if="${product.tipo != null and #strings.toLowerCase(product.tipo) != 'servicio'}">

                    <label for="modal-select-recepcion" style="font-weight:bold; display:block; margin-bottom:5px;">Método de Recepción:</label>
                    <select id="modal-select-recepcion" style="width:100%; padding:8px; border-radius:5px; border:1px solid #ccc;">
                        <option value="enMano"
                                th:if="${product.recepcionAceptada != null and (product.recepcionAceptada.name() == 'enMano' or product.recepcionAceptada.name() == 'Ambos')}">
                            En Mano
                        </option>
                        <option value="enTaquilla"
                                th:if="${product.recepcionAceptada != null and (product.recepcionAceptada.name() == 'enTaquilla' or product.recepcionAceptada.name() == 'Ambos')}">
                            En Taquilla
                        </option>
                    </select>
                </div>

                <div th:if="${#strings.toLowerCase(product.tipo) == 'servicio'}" style="margin-bottom:15px;">
                    <label for="modal-input-horas" style="font-weight:bold; display:block; margin-bottom:5px;">Horas a contratar:</label>
                    <input type="number" id="modal-input-horas" value="1" min="1" max="1"
                           oninput="actualizarPrecioTotal()"
                           style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;">
                </div>

                <div id="modal-total-container" style="margin-top: 15px; font-size: 1.2em; font-weight: bold; text-align: right; color: #00587C;">
                    Total: <span id="precio-total-display" th:text="${product.precio}">0</span> Monedas
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="cerrarModalCompra()" class="btn-estilo btn-volver" style="padding: 10px 20px;">Cancelar</button>
                <button onclick="enviarCompra()" class="btn-estilo" style="padding: 10px 20px;">Confirmar</button>
            </div>
        </div>
    </div>
    <script src="/js/common.js" ></script>
    <script src="/js/product.js" ></script>
    <script th:inline="javascript">
        const precioBase = [[${product.precio}]];
        const vendedorDNI = [[${product.uDNIVendedor}]];
        const productoID = [[${product.id}]];
    </script>
</body>
</html>
