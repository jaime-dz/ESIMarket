<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis Chats - ESI Market</title>
    <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            max-width: none !important;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div th:replace="~{common/general-fragments :: sidebar}"></div>
    <div th:replace="~{common/general-fragments :: menu-superior}"></div>
    <main>
        <div class="chat-interface-container">

            <div class="chat-sidebar" id="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3>Mis <span>Mensajes</span></h3>
                </div>
                <div class="chat-list" id="chat-list-container">
                    <div class="empty-chats">
                        <img src="/Images/logo64.png" style="opacity:0.2; width:40px; margin-bottom:10px;"><br>
                        Cargando conversaciones...
                    </div>
                </div>
            </div>

            <div class="chat-main" id="chat-main">

                <div class="chat-header" id="chat-header" style="display:none;">
                    <div class="back-button" onclick="cerrarChatMovil()">←</div>
                    <img id="current-chat-img" src="" alt="" style="width:45px; height:45px; border-radius:50%; margin-right:15px; object-fit: cover; border: 1px solid #ddd;">
                    <div>
                        <div id="current-chat-user" style="font-weight:bold; font-size:1.1em;">Usuario</div>
                        <div id="current-chat-product" style="font-size:0.85em; color:#666;">Producto</div>
                    </div>
                </div>

                <div class="chat-messages" id="chat-container">
                    <div class="no-chat-selected">
                        <img src="/Images/logo64.png" style="opacity:0.5; margin-bottom:20px;">
                        <p style="font-size:1.2em; color:#aaa;">Selecciona un chat para comenzar</p>
                    </div>
                </div>

                <div class="chat-input-area" id="input-area" style="display:none;">
                    <input type="text" id="mensajeInput" maxlength="129" placeholder="Escribe un mensaje..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
                    <button onclick="enviarMensaje()">Enviar</button>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
    <script src="/js/common.js" ></script>
    <script src="/js/chat.js" ></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const currentUserDni = /*[[${#authentication.name}]]*/ 'anonimo';
        /*]]>*/
    </script>
</body>
</html>
