<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Perfil</title>
    <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
</head>
<body>
    <div th:replace="~{common/general-fragments :: sidebar}"></div>
    <div th:replace="~{common/general-fragments :: menu-superior}"></div>
    <main>
        <div class="profile-wrapper">

            <div class="imagen-left">
                <img src="/Images/huevoverde.jpeg" width="256px" height="256px" alt="Foto de perfil"/>
            </div>

            <div class="form-container">
                <h2>Mi Perfil</h2>

                <div class="profile-data">
                    <div class="profile-box">
                        <span class="box-label">Nombre</span>
                        <span class="box-value" th:text="${profile.nombre}">Nombre</span>
                    </div>

                    <div class="profile-box">
                        <span class="box-label">Apellidos</span>
                        <span class="box-value" th:text="${profile.apellidos}">Apellidos</span>
                    </div>

                    <div class="profile-box full-width">
                        <span class="box-label">Correo Electrónico</span>
                        <span class="box-value" th:text="${profile.correo}">correo@ejemplo.com</span>
                    </div>

                    <div class="profile-box">
                        <span class="box-label">Carrera</span>
                        <span class="box-value" th:text="${profile.carrera}">Carrera</span>
                    </div>

                    <div class="profile-box">
                        <span class="box-label">Saldo Disponible</span>
                        <span class="box-value" style="color: #E57200;" th:text="${profile.saldoMoneda + ' ⚙️'}">0 ⚙️</span>
                    </div>
                </div>

                <div class="profile-actions-container">

                    <div class="left-actions">
                        <button type="button" class="btn-common btn-orange" onclick="window.location.href='/profile/edit'">
                            Editar Perfil
                        </button>
                        <button type="button" id="change-password" class="btn-common btn-gray" onclick="window.location.href='/profile/edit/password'">
                            Cambiar Contraseña
                        </button>
                    </div>

                    <button type="button" class="btn-common btn-red" onclick="abrirModalEliminar()">
                        Eliminar Perfil
                    </button>
                </div>
            </div>

        </div>
        <div id="modalEliminarPerfil" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModalEliminar()">&times;</span>
                <h2 style="color: #dc3545; margin-top: 0;">Eliminar Cuenta</h2>
                <p>¿Estás seguro de que quieres eliminar tu perfil permanentemente?</p>
                <p style="font-size: 0.9em; color: #666;">Esta acción no se puede deshacer y perderás tu historial.</p>

                <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button class="btn-common btn-gray" onclick="cerrarModalEliminar()">Cancelar</button>
                    <button class="btn-common btn-red" onclick="confirmarEliminarPerfil()">Sí, eliminar</button>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
    <script src="/js/common.js" ></script>
    <script src="/js/profile.js" ></script>
</body>
</html>
