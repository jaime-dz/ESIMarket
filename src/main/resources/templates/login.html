<!--Formulario de inicio de sesión-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>Iniciar Sesión</title>
        <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
    </head>
    <body>
        <div th:replace="~{common/general-fragments :: menu-superior}"></div>
        <main>
            <div class="form-container">
                <h2>Iniciar sesión</h2>
                <form id="login" method="post">
                    <div id="login-message"></div>
                    <div id="error-login"></div>
                    <div class="usuario">
                        <label for="usuario">Usuario*</label><br>
                        <input autofocus type="text" name="username" placeholder="Escribe tu usuario" required>
                    </div>
                    <br>
                    <div class="contraseña">
                        <label for="contraseña">Contraseña*</label><br>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" minlength="8" required>
                            <span class="password-toggle-icon" onclick="togglePassword('password', this)">🙈</span>
                        </div> <br><br>
                    </div>
                    <div class="submit-button">
                        <button type="submit">Acceder</button>
                    </div>
                    <p>¿No tienes una cuenta? <a class="links" href="signup">Regístrate</a></p>
                </form>
            </div>
        </main>
        <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
        <script src="/js/common.js" ></script>
        <script src="/js/login.js" ></script>
    </body>
</html>
