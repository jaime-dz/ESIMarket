<!--Formulario de inicio de sesión-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión</title>
        <link rel="stylesheet" href="/css/general_styles.css">
        <link rel="icon" href="/Images/favicon.ico" type="image/x-icon">
        <style>
            /* 1. Contenedor Principal Específico para Login */
            .login-wrapper {
                display: flex;
                justify-content: center; /* Centrado Horizontal */
                align-items: center;     /* Centrado Vertical */
                min-height: 80vh;        /* Altura mínima para asegurar que quede centrado en pantalla */
                background-color: #f4f6f8; /* Color de fondo suave, diferente al blanco de la tarjeta */
                padding: 20px;
            }

            /* 2. La Tarjeta de Login (La caja blanca) */
            .login-box {
                background-color: white;
                width: 100%;
                max-width: 550px;        /* ANCHO: Aquí definimos que sea grande (550px) */
                padding: 50px;           /* ESPACIO INTERNO: Para que se vea grande y aireado */
                border-radius: 12px;     /* Bordes redondeados */
                box-shadow: 0 5px 25px rgba(0,0,0,0.1); /* Sombra elegante */
                text-align: center;
            }

            /* Títulos */
            .login-box h2 {
                color: #00587C;
                margin-top: 0;
                margin-bottom: 30px;
                font-size: 2rem;
            }

            /* Campos del formulario */
            .custom-form-group {
                margin-bottom: 25px;
                text-align: left;
            }

            .custom-form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
                color: #333;
                font-size: 1.1rem;
            }

            .custom-form-group input {
                width: 100%;
                padding: 15px;          /* Inputs altos y cómodos */
                font-size: 1rem;
                border: 1px solid #ccc;
                border-radius: 8px;
                box-sizing: border-box; /* Vital para que el padding no rompa el ancho */
            }

            /* Botón Específico */
            .btn-custom-login {
                width: 100%;
                padding: 15px;
                background-color: #00587C;
                color: white;
                font-size: 1.2rem;
                font-weight: bold;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                margin-top: 10px;
                transition: background 0.3s;
            }

            .btn-custom-login:hover {
                background-color: #E57200;
            }
        </style>
    </head>
    <body>
        <header class="menu-bar menu-superior">
            <div class="header-left">
                <img class="logo-item" src="/Images/logo64.png" alt="Logo ESIMarket">
                <h1 style="color:#E57200; font-family: monospace; font-weight: bold; margin:0;">ESI</h1>
                <h1 style="color:#ffffff; font-family: monospace; margin:0;">Market</h1>
            </div>

            <nav class="header-center">
                <ul>
                    <li><a href="/home/">Inicio</a></li> <li><a href="/home/about">Sobre nosotros</a></li>
                </ul>
            </nav>

            <div class="header-right">
                
                <div class="guest-view">
                    <a href="/auth/login">Iniciar sesión</a>
                    <a href="/auth/signup" style="background-color: rgba(255,255,255,0.1); border-radius:5px;">Registrarse</a>
                </div>

                <div class="user-view" style="display: none;">
                    
                    <button class="btn-publicar" onclick="window.location.href='/home/publish'">Publicar</button>
                    
                    <div class="profile-container">
                        <div class="coins-info">
                            <span th:text="${profile?.saldoMoneda}"></span> <span>⚙️</span>
                        </div>
                        <img class="profile-avatar" src="/Images/huevoverde.jpeg" alt="Perfil">
                        
                        <div class="dropdown-content">
                            <a href="/profile/">Mi Perfil</a>
                            <a href="#" id="btn-logout">Cerrar sesión</a>
                        </div>
                    </div>
                </div>

            </div>
        </header>
        <main>
            <div class="form-container">
                <h2>Iniciar sesión</h2>
                <form id="login" method="post">
                    <div id="login-message"></div>
                    <div id="error-login"></div>
                    <div class="usuario">
                        <label for="usuario">Usuario*</label><br>
                        <input autofocus type="text" name="username" placeholder="Escribe tu usuario" required>
                    </div>
                    <br>
                    <div class="contraseña">
                        <label for="contraseña">Contraseña*</label><br>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" minlength="8" required>
                            <span class="password-toggle-icon" onclick="togglePassword('password', this)">🙈</span>
                        </div> <br><br>
                    </div>
                    <div class="submit-button">
                        <button type="submit">Acceder</button>
                    </div>
                    <p>¿No tienes una cuenta? <a class="links" href="signup">Regístrate</a></p>
                </form>
            </div>
        </main>
        
        
        <footer class="menu-bar menu-inferior">
            <ul>
                <li><a th:href="@{/home/}">Inicio</a></li>
                <li><a th:href="@{/home/about}">Sobre nosotros</a></li>

                <li class="guest-view">
                    <a th:href="@{/auth/login}">Iniciar sesión</a>
                </li>
                <li class="guest-view">
                    <a th:href="@{/auth/signup}">Registrarse</a>
                </li>

                <li class="sn">
                    <a href="https://www.instagram.com/esimarket_uca/"><img width="64px" height="64px" src="/Images/instagram.png" alt="Instagram"></a>
                    <a href="https://x.com/esimarket_uca"><img width="64px" height="64px" src="/Images/twitter.png" alt="Twitter"></a>
                </li>
            </ul>
        </footer>
        <script src="/js/common.js" type="module"></script>
        <script src="/js/login.js" type="module"></script>
        <script>
            function togglePassword(inputId, iconElement) {
                const input = document.getElementById(inputId);
                
                if (input.type === "password") {
                    input.type = "text";
                    iconElement.textContent = "👁️";
                } else {
                    input.type = "password";
                    iconElement.textContent = "🙈";
                }
            }
        </script>
    </body>
</html>
