<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Donaciones</title>
    <th:block th:replace="~{common/general-fragments :: common-head}"></th:block>
</head>
<body>
    <div th:replace="~{common/general-fragments :: sidebar}"></div>
    <div th:replace="~{common/general-fragments :: menu-superior}"></div>
    <main style="padding: 40px; width: 100%; box-sizing: border-box;">

        <div class="donations-layout" style="display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; align-items: flex-start;">

            <div class="donation-container" style="flex: 1; min-width: 300px; max-width: 600px;">
                <div class="donation-card">
                    <svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>

                    <div class="donation-title">Tu Generosidad</div>

                    <div class="donation-count-wrapper">
                        <span id="current-count">0</span>
                        <span class="max-limit">/ 5</span>
                    </div>

                    <div class="donation-label">Donaciones realizadas</div>

                    <p class="donation-subtitle">
                        ¡Gracias! Has contribuido <span id="subtitle-count" class="highlight-text">0 veces</span> a mejorar nuestra comunidad universitaria.
                    </p>
                </div>
            </div>

            <div sec:authorize="hasRole('ROLE_ADMIN')"
                 style="width: 350px; background: #fff; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; height: fit-content; border: 1px solid #eee;">

                <div style="background: linear-gradient(135deg, #E57200 0%, #ff8c00 100%); padding: 20px; color: white;">
                    <h3 style="margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 10px;">
                        🛠️ Administración
                    </h3>
                </div>

                <div style="padding: 25px;">
                    <p style="font-size: 0.9rem; color: #666; margin-bottom: 20px; line-height: 1.5;">
                        Registrar donación manual.
                    </p>

                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 8px;">DNI Usuario</label>
                        <input type="text" id="inputDniUsuario" placeholder="Ej: u{dni}"
                               style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: border 0.3s; box-sizing: border-box;">
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 8px;">Cantidad (€)</label>
                        <input type="number"
                               id="inputCantidad"
                               placeholder="0.00"
                               step="1"
                               min="1"
                               oninput="if(this.value < 0) this.value = 0;"
                               style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: border 0.3s; box-sizing: border-box;">
                    </div>

                    <button onclick="realizarDonacionManual()"
                            style="width: 100%; background: #00587C; color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: transform 0.2s, background 0.2s;">
                        Confirmar Ingreso
                    </button>
                </div>
            </div>

        </div>
    </main>
    <div th:replace="~{common/general-fragments :: menu-inferior}"></div>
    <script src="/js/common.js" ></script>
    <script src="/js/donation.js" ></script>
</body>
</html>
